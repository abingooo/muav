# MPC ROS 适配层配置
# 策略核心参数在 mpc_config.yaml；本文件只描述 ROS 话题、角色、坐标系和输出。

adapter:
  # 原生输出 quadrotor_msgs/PositionCommand 的话题。
  output_topic: /uav1/position_cmd
  # 可选：同时输出 geometry_msgs/PoseStamped，接 core 的 toplan/single_plan_point。
  plan_point_enabled: true
  plan_point_topic: /toplan/single_plan_point
  # plan_point 使用 mpc_config.yaml environment.plan_point_lookahead_m 生成前视点。
  # 坐标系通常应与 output_frame_id 一致。
  plan_point_frame_id: enemy
  # 输出坐标系。local 表示转回 output_role 对应 UAV 的本地坐标系；world 表示保留 MPC 世界系。
  output_frame: local
  # MPC 控制对象固定是 enemy；这里保持和 ADV 一致的 output_role 范式。
  output_role: enemy
  output_frame_id: enemy
  output_default_height: 1.0
  output_velocity_z: 0.0
  publish_rate_hz: 10.0
  stale_timeout_sec: 0.5
  mpc_config_path: mpc_config.yaml
  # 当前实验只启用两架防守机：uav0 -> defender_0, uav1 -> defender_1。
  active_defender_roles: [defender_0, defender_1]

position_command:
  kx: [5.7, 5.7, 6.2]
  kv: [3.4, 3.4, 4.0]
  yaw: 0.0
  yaw_dot: 0.0
  trajectory_id: 1

defaults:
  # 输入话题还没收到时，各角色使用的默认状态。position/velocity 在对应 UAV 本地坐标系下。
  states:
    enemy:
      position: [0.0, 0.0, 0.0]
      velocity: [0.0, 0.0, 0.0]
    defender_0:
      position: [0.0, 0.0, 0.0]
      velocity: [0.0, 0.0, 0.0]
    defender_1:
      position: [0.0, 0.0, 0.0]
      velocity: [0.0, 0.0, 0.0]
    defender_2:
      position: [0.0, 0.0, 0.0]
      velocity: [0.0, 0.0, 0.0]
    defender_3:
      position: [0.0, 0.0, 0.0]
      velocity: [0.0, 0.0, 0.0]

coordinate_transforms:
  # local_to_world 定义：world_position = Rz(yaw_deg) * local_position + translation
  # velocity 只做旋转，不加 translation。
  # yaw_deg 逆时针为正，顺时针为负。
  # 当前实验世界范围：x[-8.1, 4.5], y[-4.5, 4.5], z[0.0, 3.0]。
  # enemy 本地 x 与世界 x 同向；drone0/drone1 本地 x 与世界 x 反向。
  enemy:
    translation: [-8.1, 0.0, 0.0]
    yaw_deg: 0.0
  defender_0:
    translation: [0.0, 1.5, 0.0]
    yaw_deg: 180.0
  defender_1:
    translation: [0.0, -1.5, 0.0]
    yaw_deg: 180.0
  defender_2:
    translation: [-4.45, 0.0, 0.0]
    yaw_deg: 180.0
  defender_3:
    translation: [4.45, 4.45, 0.0]
    yaw_deg: 180.0

inputs:
  # message_type 支持 auto / nav_msgs/Odometry / geometry_msgs/PointStamped。
  - role: enemy
    topic: /uav1/vins_position
    message_type: auto
  - role: defender_0
    topic: /uav0/vins_position
    message_type: auto
  - role: defender_1
    topic: /uav2/vins_position
    message_type: auto

game_end:
  # 终局判定开关。launch 可用 game_end_enabled 覆盖。
  enabled: true
  # 资产坐标默认从 MPC 的 mpc_config.yaml 读取 environment.origin。
  # 世界边界默认从 MPC 的 mpc_config.yaml 读取 environment.x_min/x_max/y_min/y_max。
  # 防守机与敌机三维距离小于该值并持续 hold_duration_sec，防守机获胜。
  capture_distance_m: 1.0
  # 敌机与关键资产水平距离小于该值并持续 hold_duration_sec，敌机获胜。
  asset_distance_m: 1.0
  hold_duration_sec: 0.5
  # 任意已收到状态的飞机越出 world_bounds 就判定实验失败。
  out_of_bounds_enabled: true
  # 世界坐标范围，终局越界判定直接使用这里的显式配置。
  world_bounds:
    x: [-10, 4.5]
    y: [-4.5, 4.5]
    z: [-1, 3.0]
  # 终局后 MPC 会向所有映射飞机的 /position_cmd 发布一次当前位置悬停命令。
  # 默认由 inputs 的 /uavX/vins_position 自动推导 /uavX/position_cmd；
  # 特殊话题可在这里按 role 覆盖。
  command_topics: {}
