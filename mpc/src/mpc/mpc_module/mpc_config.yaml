# MPC 策略参数配置
# 这里只放 enemy MPC 核心策略参数，不放 ROS 话题映射。

environment:
  dt: 0.2
  max_steps: 220
  origin:
  - 0.0
  - 0.0
  - 1.0
  # MPC 世界坐标范围：x[-8.1, 4.5], y[-4.5, 4.5], z[0.0, 3.0]。
  x_min: -8.1
  x_max: 4.5
  y_min: -4.5
  y_max: 4.5
  z_min: 0.0
  z_max: 3.0
  default_z: 1.0
  clamp_predicted_position: true
  enemy_step_safety: 0.9
  origin_radius_xy: 2.5
  enemy_z_band_half: 3.2
  enemy_z_recover_margin: 0.45
  enemy_z_global_margin: 0.8
enemy:
  policy_mode: mpc_lite
  difficulty_preset: medium
  speed: 0.8
  spawn_radius: 20.0
