# ROS 适配层配置
# 这里描述话题和模型角色的对应关系，不放神经网络/策略参数。

adapter:
  # 输出 quadrotor_msgs/PositionCommand 的话题。
  output_topic: /position_cmd
  # 可选：同时输出 geometry_msgs/PoseStamped，接 core 的 toplan/single_plan_point。
  plan_point_enabled: false
  plan_point_topic: /toplan/single_plan_point
  # plan_point 复用 PositionCommand 坐标，通常应与 output_frame_id 一致。
  plan_point_frame_id: local
  # 输出哪一架防守机的控制指令。可选：defender_0 / defender_1 / defender_2 / defender_3。
  output_role: defender_0
  # 输出 PositionCommand 的固定高度。ADV 只推理水平运动，输出高度由这里指定。
  output_default_height: 1.0
  # 输出 PositionCommand.velocity.z。通常保持 0，让下游按固定高度控制。
  output_velocity_z: 0.0
  # 输出坐标系。local 表示转回 output_role 对应 UAV 的本地坐标系；world 表示保留 ADV 世界系。
  output_frame: local
  # 适配层主循环频率。
  publish_rate_hz: 20.0
  # 如果输入话题长时间没更新，就使用下面 defaults 里的默认值。
  stale_timeout_sec: 0.5
  # PositionCommand.position = 当前防守机位置 + 推理速度 * command_position_dt。
  command_position_dt: 0.1
  # 输出消息坐标系，即 ROS header.frame_id。
  output_frame_id: local
  # true 时，如果输入话题只有 PointStamped 没有速度，就用两帧位置差估计速度。
  estimate_velocity_from_position: true
  # 推理核心参数文件。
  inference_config_path: inference_config.yaml

defaults:
  # 输入话题还没收到时，各角色使用的默认状态。这里的 position/velocity 在对应 UAV 的本地坐标系下。
  states:
    defender_0:
      position: [1.0, 1.2, 1.0]
      velocity: [0.0, 0.0, 0.0]
    defender_1:
      position: [-1.4, 0.8, 1.0]
      velocity: [0.0, 0.0, 0.0]
    defender_2:
      position: [0.6, -1.5, 1.0]
      velocity: [0.0, 0.0, 0.0]
    defender_3:
      position: [-0.9, -1.0, 1.0]
      velocity: [0.0, 0.0, 0.0]
    enemy:
      position: [28.0, 12.0, 1.0]
      velocity: [-4.0, -1.2, 0.0]

coordinate_transforms:
  # local_to_world 定义：world_position = Rz(yaw_deg) * local_position + translation
  # velocity 只做旋转，不加 translation。
  # translation 是对应 UAV 起飞点/本地原点在 ADV 世界坐标系中的位置。
  # yaw_deg 是对应 UAV 本地 x 轴相对 ADV 世界 x 轴的偏航角。
  # yaw_deg 遵循右手坐标系：逆时针为正，顺时针为负。
  # 例如 yaw_deg: 90 表示本地 x 正方向会转到 ADV 世界 y 正方向。
  # 如果现场量到的是顺时针 30 度，这里应填写 yaw_deg: -30。
  defender_0:
    translation: [0.0, 0.0, 0.0]
    yaw_deg: 0.0
  defender_1:
    translation: [0.0, 0.0, 0.0]
    yaw_deg: 0.0
  defender_2:
    translation: [0.0, 0.0, 0.0]
    yaw_deg: 0.0
  defender_3:
    translation: [0.0, 0.0, 0.0]
    yaw_deg: 0.0
  enemy:
    translation: [0.0, 0.0, 0.0]
    yaw_deg: 0.0

inputs:
  # message_type 支持 auto / nav_msgs/Odometry / geometry_msgs/PointStamped。
  # auto 会用 rospy.AnyMsg 订阅，并根据连接头里的 type 自动解析。
  - role: defender_0
    topic: /uav0/vins_position
    message_type: auto
  - role: defender_1
    topic: /uav1/vins_position
    message_type: auto
  - role: defender_2
    topic: /uav2/vins_position
    message_type: auto
  - role: defender_3
    topic: /uav3/vins_position
    message_type: auto
  - role: enemy
    topic: /uav5/vins_position
    message_type: auto

position_command:
  # 下游控制器使用的简单增益。需要时可以按实际控制器调。
  kx: [5.7, 5.7, 6.2]
  kv: [3.4, 3.4, 4.0]
  yaw: 0.0
  yaw_dot: 0.0
  trajectory_id: 1
